<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft-glow': '0 20px 40px -15px rgba(0, 0, 0, 0.5)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Transiciones suaves en botones */
        .btn-calc {
            transition: all 0.1s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-calc:hover {
            filter: brightness(1.15);
        }

        .btn-calc:active {
            transform: scale(0.95) !important;
        }

        /* Resaltado al presionar tecla */
        .key-active {
            transform: scale(0.94) !important;
            filter: brightness(1.4) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5) !important;
        }

        /* Scrollbar suave */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white p-4">

    <!-- Notificación Toast -->
    <div id="toast" class="fixed top-5 right-5 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-medium text-xs shadow-2xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50 transform -translate-y-2">
        <i class="fa-solid fa-check text-emerald-400"></i>
        <span>Copiado al portapapeles</span>
    </div>

    <!-- Barra Superior Limpia -->
    <header class="w-full max-w-md mx-auto py-2 flex justify-end items-center">
        <button id="toggle-history-btn" class="p-2.5 rounded-xl bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-all border border-slate-800/80" title="Ver Historial">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 flex flex-col items-center justify-center w-full max-w-md mx-auto my-auto">
        
        <!-- Tarjeta de Calculadora -->
        <div class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 shadow-soft-glow flex flex-col justify-between relative overflow-hidden">
            
            <!-- Pantalla de Display -->
            <div id="copy-trigger" title="Clic para copiar" class="group bg-slate-950/90 border border-slate-800/90 rounded-2xl p-5 mb-4 flex flex-col justify-end items-end min-h-[120px] shadow-inner relative cursor-pointer hover:border-slate-700 transition-all">
                <span class="absolute top-3 left-3 text-[10px] uppercase font-semibold tracking-wider text-slate-500 group-hover:text-slate-300 transition-colors flex items-center gap-1 opacity-0 group-hover:opacity-100">
                    <i class="fa-regular fa-copy"></i> Copiar
                </span>
                <!-- Expresión -->
                <div id="expression-display" class="text-slate-400 text-xs font-mono h-5 tracking-wide truncate max-w-full"></div>
                <!-- Valor Principal -->
                <div id="main-display" class="text-4xl font-bold text-slate-100 tracking-wider truncate max-w-full transition-all duration-150">0</div>
            </div>

            <!-- Panel de Historial (Desplegable) -->
            <div id="history-panel" class="hidden bg-slate-950/95 border border-slate-800/90 rounded-2xl p-4 mb-4 flex-col justify-between transition-all duration-300">
                <div class="flex justify-between items-center pb-2.5 mb-2.5 border-b border-slate-800/80">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-history text-blue-400"></i> Historial
                    </span>
                    <button id="clear-history-btn" class="text-xs text-slate-500 hover:text-rose-400 transition-colors flex items-center gap-1 px-2 py-0.5 rounded-md hover:bg-slate-900">
                        <i class="fa-solid fa-trash-can"></i> Limpiar
                    </button>
                </div>

                <div id="history-list" class="space-y-2 max-h-[200px] overflow-y-auto custom-scrollbar pr-1">
                    <div id="empty-history" class="text-center py-6 text-slate-600 text-xs">
                        Sin operaciones recientes
                    </div>
                </div>
            </div>

            <!-- Teclado -->
            <div class="grid grid-cols-4 gap-2">
                <!-- Funciones Especiales -->
                <button data-key="sqr" class="btn-calc bg-slate-800/40 text-slate-300 hover:bg-slate-800/70 border border-slate-800 font-medium p-3 rounded-xl text-xs flex items-center justify-center">x²</button>
                <button data-key="sqrt" class="btn-calc bg-slate-800/40 text-slate-300 hover:bg-slate-800/70 border border-slate-800 font-medium p-3 rounded-xl text-xs flex items-center justify-center">√x</button>
                <button data-key="recip" class="btn-calc bg-slate-800/40 text-slate-300 hover:bg-slate-800/70 border border-slate-800 font-medium p-3 rounded-xl text-xs flex items-center justify-center">1/x</button>
                <button data-key="%" class="btn-calc bg-slate-800/40 text-slate-300 hover:bg-slate-800/70 border border-slate-800 font-medium p-3 rounded-xl text-sm flex items-center justify-center">%</button>

                <!-- Fila 1 -->
                <button data-key="Clear" class="btn-calc bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 font-semibold p-3.5 rounded-xl text-sm flex items-center justify-center">AC</button>
                <button data-key="Backspace" class="btn-calc bg-slate-800/60 text-slate-300 hover:bg-slate-800 border border-slate-800 font-medium p-3.5 rounded-xl text-sm flex items-center justify-center">⌫</button>
                <button data-key="PlusMinus" class="btn-calc bg-slate-800/60 text-slate-300 hover:bg-slate-800 border border-slate-800 font-medium p-3.5 rounded-xl text-sm flex items-center justify-center">⁺/₋</button>
                <button data-key="/" class="btn-calc bg-blue-600/70 text-white hover:bg-blue-600 border border-blue-500/30 font-semibold p-3.5 rounded-xl text-base flex items-center justify-center">÷</button>

                <!-- Fila 2 -->
                <button data-key="7" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">7</button>
                <button data-key="8" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">8</button>
                <button data-key="9" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">9</button>
                <button data-key="*" class="btn-calc bg-blue-600/70 text-white hover:bg-blue-600 border border-blue-500/30 font-semibold p-3.5 rounded-xl text-base flex items-center justify-center">×</button>

                <!-- Fila 3 -->
                <button data-key="4" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">4</button>
                <button data-key="5" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">5</button>
                <button data-key="6" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">6</button>
                <button data-key="-" class="btn-calc bg-blue-600/70 text-white hover:bg-blue-600 border border-blue-500/30 font-semibold p-3.5 rounded-xl text-base flex items-center justify-center">-</button>

                <!-- Fila 4 -->
                <button data-key="1" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">1</button>
                <button data-key="2" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">2</button>
                <button data-key="3" class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">3</button>
                <button data-key="+" class="btn-calc bg-blue-600/70 text-white hover:bg-blue-600 border border-blue-500/30 font-semibold p-3.5 rounded-xl text-base flex items-center justify-center">+</button>

                <!-- Fila 5 -->
                <button data-key="0" class="col-span-2 btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">0</button>
                <button data-key="." class="btn-calc bg-slate-800/30 text-slate-200 hover:bg-slate-800/60 border border-slate-800/60 font-medium p-3.5 rounded-xl text-base flex items-center justify-center">.</button>
                <button data-key="Enter" class="btn-calc bg-blue-600 text-white hover:bg-blue-500 border border-blue-400/30 font-semibold p-3.5 rounded-xl text-lg flex items-center justify-center">=</button>
            </div>
        </div>
    </main>

    <footer class="py-2"></footer>

    <script>
        // --- ESTADO DE LA CALCULADORA ---
        let currentValue = '0';
        let previousValue = '';
        let operation = null;
        let shouldResetDisplay = false;
        let history = [];

        // --- ELEMENTOS DEL DOM ---
        const mainDisplay = document.getElementById('main-display');
        const expressionDisplay = document.getElementById('expression-display');
        const historyList = document.getElementById('history-list');
        const emptyHistory = document.getElementById('empty-history');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const toast = document.getElementById('toast');
        const copyTrigger = document.getElementById('copy-trigger');
        const toggleHistoryBtn = document.getElementById('toggle-history-btn');
        const historyPanel = document.getElementById('history-panel');

        // --- DISPLAY ---
        function updateDisplay() {
            mainDisplay.textContent = formatNumber(currentValue);
            if (currentValue.length > 10) {
                mainDisplay.className = "text-2xl font-bold text-slate-100 tracking-wider truncate max-w-full transition-all duration-150";
            } else {
                mainDisplay.className = "text-4xl font-bold text-slate-100 tracking-wider truncate max-w-full transition-all duration-150";
            }
        }

        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'NaN') return 'Error';
            if (numStr.endsWith('.')) return numStr;
            const parts = numStr.split('.');
            parts[0] = Number(parts[0]).toLocaleString('en-US');
            return parts.join('.');
        }

        // --- LÓGICA DE CÁLCULO ---
        function appendNumber(number) {
            if (currentValue === '0' || shouldResetDisplay) {
                currentValue = number;
                shouldResetDisplay = false;
            } else {
                if (currentValue.replace('.', '').length >= 14) return;
                currentValue += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentValue = '0.';
                shouldResetDisplay = false;
            } else if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }

        function handleOperation(op) {
            if (operation !== null && !shouldResetDisplay) {
                compute();
            }
            previousValue = currentValue;
            operation = op;
            shouldResetDisplay = true;
            expressionDisplay.textContent = `${formatNumber(previousValue)} ${getSymbol(op)}`;
        }

        function getSymbol(op) {
            switch(op) {
                case '+': return '+';
                case '-': return '-';
                case '*': return '×';
                case '/': return '÷';
                default: return '';
            }
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '*': computation = prev * current; break;
                case '/':
                    if (current === 0) {
                        currentValue = 'Error';
                        expressionDisplay.textContent = '';
                        operation = null;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default: return;
            }

            computation = Math.round(computation * 100000000) / 100000000;
            const fullExpr = `${formatNumber(previousValue)} ${getSymbol(operation)} ${formatNumber(currentValue)} =`;
            addHistoryItem(fullExpr, computation.toString());

            expressionDisplay.textContent = fullExpr;
            currentValue = computation.toString();
            operation = null;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function executeSpecial(type) {
            let val = parseFloat(currentValue);
            if (isNaN(val)) return;
            let result;
            let exprText = '';

            if (type === 'sqr') {
                result = val * val;
                exprText = `sqr(${formatNumber(currentValue)})`;
            } else if (type === 'sqrt') {
                if (val < 0) { currentValue = 'Error'; updateDisplay(); return; }
                result = Math.sqrt(val);
                exprText = `√(${formatNumber(currentValue)})`;
            } else if (type === 'recip') {
                if (val === 0) { currentValue = 'Error'; updateDisplay(); return; }
                result = 1 / val;
                exprText = `1/(${formatNumber(currentValue)})`;
            }

            result = Math.round(result * 100000000) / 100000000;
            addHistoryItem(exprText, result.toString());
            expressionDisplay.textContent = `${exprText} =`;
            currentValue = result.toString();
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearAll() {
            currentValue = '0';
            previousValue = '';
            operation = null;
            shouldResetDisplay = false;
            expressionDisplay.textContent = '';
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay) return;
            if (currentValue.length === 1 || (currentValue.length === 2 && currentValue.startsWith('-'))) {
                currentValue = '0';
            } else {
                currentValue = currentValue.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentValue === '0' || currentValue === 'Error') return;
            currentValue = (parseFloat(currentValue) * -1).toString();
            updateDisplay();
        }

        function applyPercentage() {
            if (currentValue === 'Error') return;
            currentValue = (parseFloat(currentValue) / 100).toString();
            updateDisplay();
        }

        // --- HISTORIAL ---
        function addHistoryItem(expr, result) {
            history.unshift({ expr, result });
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistory.classList.remove('hidden');
                historyList.innerHTML = '';
                historyList.appendChild(emptyHistory);
                return;
            }

            emptyHistory.classList.add('hidden');
            historyList.innerHTML = '';

            history.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'p-2 bg-slate-900/60 hover:bg-slate-900 rounded-xl cursor-pointer border border-slate-800/60 transition-all text-right group';
                div.innerHTML = `
                    <div class="text-[10px] text-slate-500 font-mono group-hover:text-blue-400 transition-colors">${item.expr}</div>
                    <div class="text-sm font-medium text-slate-200">${formatNumber(item.result)}</div>
                `;
                div.addEventListener('click', () => {
                    currentValue = item.result;
                    shouldResetDisplay = true;
                    updateDisplay();
                });
                historyList.appendChild(div);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            renderHistory();
        });

        // --- TECLAS Y EVENTOS ---
        function triggerKeyAnimation(key) {
            const button = document.querySelector(`[data-key="${key}"]`);
            if (button) {
                button.classList.add('key-active');
                setTimeout(() => button.classList.remove('key-active'), 140);
            }
        }

        function handleInput(key) {
            triggerKeyAnimation(key);

            if (key >= '0' && key <= '9') appendNumber(key);
            else if (key === '.') appendDecimal();
            else if (['+', '-', '*', '/'].includes(key)) handleOperation(key);
            else if (key === 'Enter' || key === '=') compute();
            else if (key === 'Clear' || key === 'Escape') clearAll();
            else if (key === 'Backspace') deleteLast();
            else if (key === 'PlusMinus') toggleSign();
            else if (key === '%') applyPercentage();
            else if (['sqr', 'sqrt', 'recip'].includes(key)) executeSpecial(key);
        }

        document.querySelectorAll('.btn-calc').forEach(button => {
            button.addEventListener('click', () => {
                const key = button.getAttribute('data-key');
                handleInput(key);
            });
        });

        window.addEventListener('keydown', (e) => {
            let key = e.key;
            if (key === 'Escape' || key === 'c' || key === 'C') key = 'Clear';
            if (key === 'x') key = '*';

            if (document.querySelector(`[data-key="${key}"]`)) {
                handleInput(key);
            } else if (key === 'Enter') {
                handleInput('Enter');
            } else if (key === 'Delete') {
                handleInput('Clear');
            }
        });

        copyTrigger.addEventListener('click', () => {
            if (currentValue === 'Error') return;
            navigator.clipboard.writeText(currentValue);
            
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }, 1800);
        });

        toggleHistoryBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
            historyPanel.classList.toggle('flex');
        });

        updateDisplay();
    </script>
</body>
</html>
